<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004C45">
<title>ISD System Control Center</title>
<style>
  :root{--isd-teal:#004C45;--isd-green:#38D430;--isd-orange:#FF5C35;--bg:#F5F7F6;--muted:#5C7B77;--isd-light-teal:#E6F2F0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--isd-teal);}
  
  /* Universal Mobile-Friendly Navigation */
  .top-nav { 
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; 
    background: #fff; padding: 8px; border-bottom: 1px solid #E0E8E6; 
    position: sticky; top: 0; z-index: 100; 
  }
  .top-nav a { 
    text-decoration: none; color: var(--isd-teal); font-weight: 800; font-size: 12px;
    padding: 8px 12px; border-radius: 8px; background: var(--isd-light-teal); 
    white-space: nowrap; transition: all .2s; flex: 1 1 auto; text-align: center; max-width: 120px;
  }
  .top-nav a.active { background: var(--isd-teal); color: #fff; }
  .top-nav a:hover { opacity: 0.8; }
  
  .container{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;font-weight:800;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  
  .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media(min-width: 850px) { .grid-layout { grid-template-columns: 1fr 1fr; } }

  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,76,69,.06);}
  .card h3{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #eee;padding-bottom:8px;}
  label{display:block;font-size:12px;font-weight:800;margin-top:12px;margin-bottom:4px;}
  input,textarea,select{width:100%;padding:10px;border:2px solid #D5DFDD;border-radius:8px;font-family:inherit;font-size:14px;background:#FAFCFB;}
  input:focus,textarea:focus{outline:none;border-color:var(--isd-teal);background:#fff;}
  textarea.code-area { font-family: 'SF Mono', Consolas, monospace; font-size: 12px; line-height: 1.4; background: #f4f6f8; color: #333; }
  
  .btn-save{background:var(--isd-teal);color:#fff;border:none;padding:16px;width:100%;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px;box-shadow:0 4px 14px rgba(0,76,69,.3);transition:transform .1s;}
  .btn-save:active { transform: scale(.98); }
  
  .tag-box { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tag { background:#E6F2F0; color:var(--isd-teal); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:800; cursor:pointer; border:1px solid #B2DFDB; transition:all .2s;}
  .tag:hover { background:var(--isd-teal); color:#fff; }

  /* Live Preview iframe */
  .preview-wrap { position: sticky; top: 80px; }
  iframe { width: 100%; height: 600px; border: 2px dashed #ccc; border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html">🏠 Home</a>
  <a href="app.html">📷 Scanner</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="admin.html">⚙️ Admin</a>
  <a href="control.html" class="active">🎛️ Control</a>
  <a href="permissions.html">🛡️ Perms</a>
  <a href="qr-generator.html">🖨️ QRs</a>
</nav>
<div class="container">
  <h1>System Control Center</h1>
  <div class="sub">Manage App Identity, API URL, Email Templates, and Shift Settings.</div>
  <div id="content">Loading...</div>
</div>
<script>
const BOOTSTRAP_API = 'https://script.google.com/macros/s/AKfycby-ijYlllqxinwkDCszrxu45etA-cq3tjYhR34SwuUSh1jP27B7pDfor0tYobfbMGsL/exec';
let GLOBAL_API = BOOTSTRAP_API;
let session = null;

let _jsonpCounter = 0;
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const callbackName = 'isdCallback_' + (++_jsonpCounter) + '_' + Date.now();
    const query = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k])).join('&');
    const url = GLOBAL_API + '?' + query + '&callback=' + callbackName;
    let scriptEl = null;
    function cleanup() { if (scriptEl) scriptEl.remove(); try { delete window[callbackName]; } catch(_) { window[callbackName] = undefined; } }
    window[callbackName] = function(data) { cleanup(); resolve(data); };
    scriptEl = document.createElement('script'); scriptEl.src = url; scriptEl.onerror = function() { cleanup(); reject(new Error('Network error')); }; document.head.appendChild(scriptEl);
  });
}

function loadUIBootstrapper() {
  return new Promise((resolve) => {
    const cb = 'bootCb_' + Date.now();
    window[cb] = function(data) {
      delete window[cb];
      if (data.ok) { GLOBAL_API = data.API_URL || BOOTSTRAP_API; }
      resolve();
    };
    const s = document.createElement('script');
    s.src = BOOTSTRAP_API + '?action=getPublicConfig&callback=' + cb;
    document.head.appendChild(s);
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  await loadUIBootstrapper();
  session = JSON.parse(localStorage.getItem('isd_session')||'null');
  if (!session || session.role !== 'admin') {
    document.getElementById('content').innerHTML = '<div style="color:red;font-weight:bold;padding:20px;text-align:center;">❌ Admin Access Required</div>';
    return;
  }
  loadConfig();
});

function loadConfig() {
  jsonp({ action: 'getConfig', token: session.token })
    .then(res => {
      if (!res.ok) throw new Error(res.error);
      renderUI(res.config);
    })
    .catch(err => {
      document.getElementById('content').innerHTML = '<div style="color:red;text-align:center;padding:20px;">Error: ' + err.message + '</div>';
    });
}

function renderUI(cfg) {
  // If there is no custom body saved in the DB yet, populate the text area with the actual HTML of the design
  let defaultHtml = cfg.EmailBody || `
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; background-color: #F5F7F6; padding: 20px;">
  
  <!-- HEADER -->
  <div style="background-color: #004C45; padding: 24px; border-radius: 12px 12px 0 0; text-align: center;">
    <h1 style="color: #FFFFFF; margin: 0; font-size: 22px;">[app_name]</h1>
    <p style="color: #FFDA00; margin: 8px 0 0 0; font-size: 14px; font-weight: bold;">Daily Inspection Report</p>
    <p style="color: #FFFFFF; margin: 4px 0 0 0; font-size: 12px; opacity: 0.8;">[date]</p>
  </div>
  
  <!-- BODY -->
  <div style="background-color: #FFFFFF; padding: 24px; border-radius: 0 0 12px 12px; border: 1px solid #E0E8E6; border-top: none;">
    <p style="color: #5C7B77; font-size: 14px; margin-top: 0;">Dear Concern(s),</p>
    <p style="color: #5C7B77; font-size: 14px;">Here is the summary of the washroom inspections performed today.</p>
    
    <!-- TABLE -->
    <table style="width: 100%; border-collapse: collapse; margin-top: 24px;">
      <tr><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #5C7B77; font-size: 14px;">Total Active Washrooms</td><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #004C45; font-size: 14px; font-weight: bold; text-align: right;">[total_washrooms]</td></tr>
      <tr><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #5C7B77; font-size: 14px;">Checked Today</td><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #0d7a3c; font-size: 14px; font-weight: bold; text-align: right;">[checked_count]</td></tr>
      <tr><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #5C7B77; font-size: 14px;">Missed</td><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #C93B14; font-size: 14px; font-weight: bold; text-align: right;">[missed_count]</td></tr>
      <tr><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #5C7B77; font-size: 14px;">GPS Issues</td><td style="padding: 12px; border-bottom: 1px solid #E0E8E6; color: #C93B14; font-size: 14px; font-weight: bold; text-align: right;">[gps_issues]</td></tr>
    </table>
    
    <!-- COMPLIANCE BOX -->
    <div style="margin-top: 24px; text-align: center;">
      <div style="display: inline-block; background-color: #38D430; color: #fff; padding: 16px 32px; border-radius: 12px; font-weight: bold;">
        <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Compliance</span><br>
        <span style="font-size: 32px;">[compliance]%</span>
      </div>
    </div>
    
    <!-- MISSED LIST -->
    <div style="margin-top: 24px;">
      <p style="color: #C93B14; font-weight: bold; margin-bottom: 8px; font-size: 14px;">MISSED WASHROOMS</p>
      <div style="background-color: #FFF7BF; padding: 12px; border-radius: 8px; border-left: 4px solid #FF5C35; color: #8A6400; font-weight: bold; font-size: 14px;">[missed_list]</div>
    </div>
    
    <!-- BUTTON -->
    <div style="text-align: center; margin-top: 30px;">
      <a href="#" style="background-color: #004C45; color: #FFFFFF; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-block;">View Full Dashboard</a>
    </div>
  </div>
  
  <!-- FOOTER -->
  <div style="text-align: center; margin-top: 20px; color: #5C7B77; font-size: 11px;">
    <p style="margin: 0 0 4px 0;">This is a system-generated email, please do not reply.</p>
    <p style="margin: 0;">The system is developed and maintained by the <strong>ISD MIS Team</strong>.</p>
  </div>
</div>`;

  let html = `
    <div class="grid-layout">
      
      <!-- LEFT COLUMN: SETTINGS -->
      <div>
        <div class="card">
          <h3>🏫 App Identity & Branding</h3>
          <label>School Name</label>
          <input type="text" id="cfg_SchoolName" value="${cfg.SchoolName || 'International School Dhaka'}">
          
          <label>App Name (Header Title)</label>
          <input type="text" id="cfg_AppName" value="${cfg.AppName || 'ISD WIMS'}">
          
          <label>Logo URL</label>
          <input type="text" id="cfg_LogoUrl" value="${cfg.LogoUrl || 'https://7d3e463591.imgdist.com/pub/bfra/ppyb5a2u/dtx/qy3/y6n/ISD%20logo.jpg'}">
          
          <label>Brand Color (Hex)</label>
          <input type="color" id="cfg_BrandColor" value="${cfg.BrandColor || '#004C45'}">
        </div>

        <div class="card">
          <h3>🔌 API Configuration</h3>
          <label>Google Apps Script URL</label>
          <input type="text" id="cfg_API_URL" value="${cfg.API_URL || BOOTSTRAP_API}">
        </div>
        
        <div class="card">
          <h3>🌐 Public Base URL</h3>
          <label>The live URL of the scanner app</label>
          <input type="text" id="cfg_PublicBase" value="${cfg.PublicBase || 'https://isd-wims.vercel.app/app.html'}">
        </div>

        <div class="card">
          <h3>🕐 Shift Settings</h3>
          <label>Shift Start (HH:MM)</label>
          <input type="time" id="cfg_ShiftStart" value="${cfg.ShiftStart || '07:30'}">
          <label>Shift End (HH:MM)</label>
          <input type="time" id="cfg_ShiftEnd" value="${cfg.ShiftEnd || '17:30'}">
          <label>Session Hours</label>
          <input type="number" id="cfg_SessionHours" value="${cfg.SessionHours || '10'}">
        </div>
      </div>

      <!-- RIGHT COLUMN: EMAIL & PREVIEW -->
      <div class="preview-wrap">
        <div class="card">
          <h3>📧 Dynamic Email Report</h3>
          <label>Recipients (comma separated)</label>
          <input type="text" id="cfg_EmailRecipients" value="${cfg.EmailRecipients || 'mis@isdbd.org'}">
          
          <label>Subject Line</label>
          <input type="text" id="cfg_EmailSubject" value="${cfg.EmailSubject || 'ISD Washroom Daily Report — [date]'}">
          
          <label>Email Body (HTML) <span style="color:var(--isd-orange);font-size:10px;">(Live Preview Below)</span></label>
          <textarea id="cfg_EmailBody" rows="10" class="code-area" oninput="updatePreview()">${defaultHtml}</textarea>
          
          <div class="tag-box">
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[date]')">[date]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[app_name]')">[app_name]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[compliance]')">[compliance]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[checked_count]')">[checked_count]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[missed_count]')">[missed_count]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[missed_list]')">[missed_list]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[gps_issues]')">[gps_issues]</span>
            <span class="tag" onclick="appendTag('cfg_EmailBody', '[total_washrooms]')">[total_washrooms]</span>
          </div>
        </div>

        <div class="card" style="background:#eef2f5;">
          <h3>👁️ Email Live Preview</h3>
          <iframe id="previewFrame"></iframe>
        </div>
        
        <button class="btn-save" onclick="saveAll()">💾 Save Control Settings</button>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  
  // Initialize the preview after the HTML is injected
  setTimeout(updatePreview, 100);
}

function appendTag(id, tag) {
  const el = document.getElementById(id);
  const start = el.selectionStart;
  el.value = el.value.substring(0, start) + tag + el.value.substring(el.selectionEnd);
  el.focus();
  el.selectionStart = el.selectionEnd = start + tag.length;
  updatePreview();
}

// Renders the HTML into the iframe with sample data so Admin can see it
function updatePreview() {
  const rawHtml = document.getElementById('cfg_EmailBody').value;
  const appName = document.getElementById('cfg_AppName').value || 'ISD WIMS';
  
  // Replace tags with dummy data for the preview
  const previewHtml = rawHtml
    .replace(/\[date\]/g, new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }))
    .replace(/\[app_name\]/g, appName)
    .replace(/\[compliance\]/g, '85.5')
    .replace(/\[checked_count\]/g, '21')
    .replace(/\[missed_count\]/g, '3')
    .replace(/\[gps_issues\]/g, '1')
    .replace(/\[missed_list\]/g, 'WC-FF-004 &bull; WC-FF-007 &bull; WC-B1-002')
    .replace(/\[total_washrooms\]/g, '24');

  const frame = document.getElementById('previewFrame');
  if (frame) {
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(previewHtml);
    doc.close();
  }
}

function saveAll() {
  const updates = {
    SchoolName: document.getElementById('cfg_SchoolName').value,
    AppName: document.getElementById('cfg_AppName').value,
    LogoUrl: document.getElementById('cfg_LogoUrl').value,
    BrandColor: document.getElementById('cfg_BrandColor').value,
    API_URL: document.getElementById('cfg_API_URL').value,
    PublicBase: document.getElementById('cfg_PublicBase').value,
    EmailRecipients: document.getElementById('cfg_EmailRecipients').value,
    EmailSubject: document.getElementById('cfg_EmailSubject').value,
    EmailBody: document.getElementById('cfg_EmailBody').value,
    ShiftStart: document.getElementById('cfg_ShiftStart').value,
    ShiftEnd: document.getElementById('cfg_ShiftEnd').value,
    SessionHours: document.getElementById('cfg_SessionHours').value
  };

  const btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ Saving...';
  btn.disabled = true;

  jsonp({ action: 'saveConfig', token: session.token, config: JSON.stringify(updates) })
    .then(res => {
      btn.textContent = '💾 Save Control Settings';
      btn.disabled = false;
      if (res.ok) {
        alert('✅ Settings saved successfully!');
        window.location.reload(); 
      } else alert('❌ Error: ' + res.error);
    })
    .catch(err => {
      btn.textContent = '💾 Save Control Settings';
      btn.disabled = false;
      alert('❌ ' + err.message);
    });
}
</script>
</body>
</html>
